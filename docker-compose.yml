services:
  kafka:
    image: confluentinc/cp-kafka:8.2.2
    container_name: coreevents-kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
  redis:
    image: redis:8.10
    container_name: coreevents-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: /bin/sh -c "[ -n \"$REDIS_PASSWORD\" ] && redis-server --requirepass \"$REDIS_PASSWORD\" || redis-server"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/var/lib/redis/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli ${REDIS_PASSWORD:+-a "$REDIS_PASSWORD"} ping | grep PONG || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: coreevents-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: coreevents-jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
  grafana:
    image: grafana/grafana:13.2.0
    container_name: coreevents-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      # - jaeger
  coreevents-users-db:
    image: postgres:18.4
    container_name: coreevents-users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_USERS}
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_USERS}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  coreevents-events-db:
    image: postgres:18.4
    container_name: coreevents-events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_EVENTS}
    ports:
      - "5434:5432"
    volumes:
      - events-db-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_EVENTS}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  coreevents-bookings-db:
    image: postgres:18.4
    container_name: coreevents-bookings-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_BOOKINGS}
    ports:
      - "5435:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_BOOKINGS}",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  kafka-console:
    image: redpandadata/console:v3.9.0
    container_name: coreevents-kafka-console
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
  users.api:
    image: ${DOCKER_REGISTRY-}usersapi
    build:
      context: .
      dockerfile: Services/Users/Users.Api/Dockerfile
    container_name: coreevents-users-api
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      CONNECTIONSTRINGS__DEFAULTCONNECTION: Host=coreevents-users-db;Port=5432;Database=${POSTGRES_DB_USERS};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JWT__SECRETKEY: ${JWT__SECRETKEY}
      JWT__ISSUER: ${JWT__ISSUER}
      JWT__AUDIENCE: ${JWT__AUDIENCE}
      JWT__EXPIRATIONINMINUTES: ${JWT__EXPIRATIONINMINUTES}
      ADMINSETTINGS__LOGIN: ${API_ADMIN_LOGIN}
      ADMINSETTINGS__PASSWORD: ${API_ADMIN_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_BSP_SCHEDULE_DELAY: 5000
      OTEL_BSP_EXPORT_TIMEOUT: 3000
    depends_on:
      coreevents-users-db:
        condition: service_healthy
    volumes:
      - ./logs/users-api:/var/log/users-api
  events.api:
    image: ${DOCKER_REGISTRY-}eventsapi
    build:
      context: .
      dockerfile: Services/Events/Events.Api/Dockerfile
    container_name: coreevents-events-api
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      CONNECTIONSTRINGS__DEFAULTCONNECTION: Host=coreevents-events-db;Port=5432;Database=${POSTGRES_DB_EVENTS};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      KAFKA__BOOTSTRAPSERVERS: kafka:9092
      JWT__SECRETKEY: ${JWT__SECRETKEY}
      JWT__ISSUER: ${JWT__ISSUER}
      JWT__AUDIENCE: ${JWT__AUDIENCE}
      JWT__EXPIRATIONINMINUTES: ${JWT__EXPIRATIONINMINUTES}
      REDIS__ENDPOINTS__0: redis:6379
      REDIS__PASSWORD: ${REDIS_PASSWORD}
      REDIS__CONNECTTIMEOUT: 5000
      REDIS__SYNCTIMEOUT: 3000
      REDIS__ABORTONCONNECTFAIL: false
      REDIS__CONNECTRETRY: 3
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_BSP_SCHEDULE_DELAY: 5000
      OTEL_BSP_EXPORT_TIMEOUT: 3000
    depends_on:
      coreevents-events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs/events-api:/var/log/events-api
  bookings.api:
    image: ${DOCKER_REGISTRY-}bookingsapi
    build:
      context: .
      dockerfile: Services/Bookings/Bookings.Api/Dockerfile
    container_name: coreevents-bookings-api
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      CONNECTIONSTRINGS__DEFAULTCONNECTION: Host=coreevents-bookings-db;Port=5432;Database=${POSTGRES_DB_BOOKINGS};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      KAFKA__BOOTSTRAPSERVERS: kafka:9092
      JWT__SECRETKEY: ${JWT__SECRETKEY}
      JWT__ISSUER: ${JWT__ISSUER}
      JWT__AUDIENCE: ${JWT__AUDIENCE}
      JWT__EXPIRATIONINMINUTES: ${JWT__EXPIRATIONINMINUTES}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_BSP_SCHEDULE_DELAY: 5000
      OTEL_BSP_EXPORT_TIMEOUT: 3000
    depends_on:
      coreevents-bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./logs/bookings-api:/var/log/bookings-api
  gateway.api:
    image: ${DOCKER_REGISTRY-}gatewayapi
    build:
      context: .
      dockerfile: Gateway/Gateway.Api/Dockerfile
    container_name: coreevents-gateway-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ReverseProxy__Clusters__users-cluster__Destinations__destination1__Address: http://users.api:8080
      ReverseProxy__Clusters__events-cluster__Destinations__destination1__Address: http://events.api:8080
      ReverseProxy__Clusters__bookings-cluster__Destinations__destination1__Address: http://bookings.api:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_BSP_SCHEDULE_DELAY: 5000
      OTEL_BSP_EXPORT_TIMEOUT: 3000
    depends_on:
      - users.api
      - events.api
      - bookings.api
      - jaeger
    volumes:
      - ./logs/gateway-api:/var/log/gateway-api
  dev-env:
    # Официальный образ Microsoft для разработки под .NET 10
    image: mcr.microsoft.com/devcontainers/dotnet:10.0
    volumes:
      # Монтируем исходный код проекта внутрь контейнера
      - .:/workspace:cached
      # upd. 1 Важно: пробрасываем докер-сокет, чтобы изнутри dev-контейнера
      # вы могли управлять другими контейнерами (например, перезапускать Kafka/Redis)
      #- /var/run/docker.sock:/var/run/docker.sock
      # upd.2 Пробую для управления docker флаг features в devcontainer.json
    # Подключаем к той же сети, где живут ваши микросервисы, Kafka и Redis
    #networks:
    #- your-feature-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  kafka-data:
  redis_data:
  bookings-db-data:
  events-db-data:
  users-db-data:
  grafana-data:
  prometheus-data:
