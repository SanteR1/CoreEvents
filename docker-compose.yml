services:
  kafka:
    image: confluentinc/cp-kafka:8.2.2
    container_name: coreevents-kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
  redis:
    image: redis:8.10
    container_name: coreevents-redis
    hostname: redis
    restart: unless-stopped
    ports:
     - "6379:6379"
    command: /bin/sh -c "[ -n \"$REDIS_PASSWORD\" ] && redis-server --requirepass \"$REDIS_PASSWORD\" || redis-server"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/var/lib/redis/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  coreevents-users-db:
    image: postgres:18.4
    container_name: coreevents-users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_USERS}
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_USERS}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  coreevents-events-db:
    image: postgres:18.4
    container_name: coreevents-events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_EVENTS}
    ports:
      - "5434:5432"
    volumes:
      - events-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_EVENTS}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  coreevents-bookings-db:
    image: postgres:18.4
    container_name: coreevents-bookings-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_BOOKINGS}
    ports:
      - "5435:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_BOOKINGS}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
  kafka-console:
    image: redpandadata/console:v3.9.0
    container_name: coreevents-kafka-console
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      - kafka
  users.api:
    image: ${DOCKER_REGISTRY-}usersapi
    build:
      context: .
      dockerfile: Services/Users/Users.Api/Dockerfile
    container_name: coreevents-users-api
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=coreevents-users-db;Port=5432;Database=${POSTGRES_DB_USERS};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpirationInMinutes=${JWT_EXPIRATION_MINUTES}
      - AdminSettings__Login=${API_ADMIN_LOGIN}
      - AdminSettings__Password=${API_ADMIN_PASSWORD}
    depends_on:
      coreevents-users-db:
        condition: service_healthy
  events.api:
    image: ${DOCKER_REGISTRY-}eventsapi
    build:
      context: .
      dockerfile: Services/Events/Events.Api/Dockerfile
    container_name: coreevents-events-api
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=coreevents-events-db;Port=5432;Database=${POSTGRES_DB_EVENTS};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Kafka__BootstrapServers=kafka:9092
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpirationInMinutes=${JWT_EXPIRATION_MINUTES}
      - Redis__EndPoints__0=redis:6379
      - Redis__Password=${REDIS_PASSWORD}
      - Redis__ConnectTimeout=5000
      - Redis__SyncTimeout=3000
      - Redis__AbortOnConnectFail=false
      - Redis__ConnectRetry=3
    depends_on:
      coreevents-events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
  bookings.api:
    image: ${DOCKER_REGISTRY-}bookingsapi
    build:
      context: .
      dockerfile: Services/Bookings/Bookings.Api/Dockerfile
    container_name: coreevents-bookings-api
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=coreevents-bookings-db;Port=5432;Database=${POSTGRES_DB_BOOKINGS};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Kafka__BootstrapServers=kafka:9092
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpirationInMinutes=${JWT_EXPIRATION_MINUTES}
    depends_on:
      coreevents-bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
volumes:
  kafka-data:
  redis_data:
  bookings-db-data:
  events-db-data:
  users-db-data: