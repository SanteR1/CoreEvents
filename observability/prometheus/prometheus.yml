global:
  scrape_interval: 15s
  # Запрещаем Prometheus запрашивать метрики с точками (UTF-8).
  # Это заставит .NET-экспортер автоматически заменять точки на '_'.
  metric_name_validation_scheme: legacy

scrape_configs:
  - job_name: events-service
    static_configs:
      - targets: ["events.api:8080"]
    metrics_path: /metrics
    metric_relabel_configs:
      - source_labels: [http_route]
        regex: '^/?v\{version:apiVersion\}/(.*)$'
        target_label: http_route
        replacement: "/v1/${1}"
      - source_labels: [http_route]
        regex: '^(.*)\{id:guid\}(.*)$'
        target_label: http_route
        replacement: "${1}{id}${2}"
      - source_labels: [http_route]
        regex: '^/openapi/\{.*$'
        target_label: http_route
        replacement: "/openapi"

  - job_name: bookings-service
    static_configs:
      - targets: ["bookings.api:8080"]
    metrics_path: /metrics
    metric_relabel_configs:
      - source_labels: [http_route]
        regex: '^/?v\{version:apiVersion\}/(.*)$'
        target_label: http_route
        replacement: "/v1/${1}"
      - source_labels: [http_route]
        regex: "^/?Bookings/(.*)$"
        target_label: http_route
        replacement: "/v1/Bookings/${1}"
      - source_labels: [http_route]
        regex: '^(.*)\{id:guid\}(.*)$'
        target_label: http_route
        replacement: "${1}{id}${2}"
      - source_labels: [http_route]
        regex: '^/openapi/\{.*$'
        target_label: http_route
        replacement: "/openapi"

  - job_name: users-service
    static_configs:
      - targets: ["users.api:8080"]
    metrics_path: /metrics
    metric_relabel_configs:
      - source_labels: [http_route]
        regex: '^/?v\{version:apiVersion\}/(.*)$'
        target_label: http_route
        replacement: "/v1/${1}"
      - source_labels: [http_route]
        regex: "^/?Auth/(.*)$"
        target_label: http_route
        replacement: "/v1/Auth/${1}"
      - source_labels: [http_route]
        regex: "^/?Users/(.*)$"
        target_label: http_route
        replacement: "/v1/Users/${1}"
      - source_labels: [http_route]
        regex: '^(.*)\{id:guid\}(.*)$'
        target_label: http_route
        replacement: "${1}{id}${2}"
      - source_labels: [http_route]
        regex: '^/openapi/\{.*$'
        target_label: http_route
        replacement: "/openapi"

  - job_name: gateway-service
    static_configs:
      - targets: ["gateway.api:5000"]
    metrics_path: /metrics
    metric_relabel_configs:
      # Нормализация YARP-роутов с regex в человекочитаемый вид (/v1/events, /v1/auth, ...)
      - source_labels: [http_route]
        regex: '^/\{version.*?\}/([^/]+).*$'
        target_label: http_route
        replacement: "/v1/${1}"
      # Нормализация путей OpenAPI (/openapi/events, ...)
      - source_labels: [http_route]
        regex: "^/openapi/([^/]+).*$"
        target_label: http_route
        replacement: "/openapi/${1}"
      # Нормализация OpenAPI схемы шлюза
      - source_labels: [http_route]
        regex: '^/openapi/\{.*$'
        target_label: http_route
        replacement: "/openapi"
      # Нормализация витрины Scalar UI
      - source_labels: [http_route]
        regex: '^/docs/\{.*$'
        target_label: http_route
        replacement: "/docs"
