name: Frontend CI (React Web)

on:
  push:
    branches: [main, master, dev-react]
    paths:
      - 'Frontend/react-web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'Frontend/react-web/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/react-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: Frontend/react-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run Unit Tests & Verify Coverage Thresholds
        run: npm run test:coverage

      - name: Production Build (Vite)
        run: npm run build

      - name: Upload Build Artifacts (dist)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: react-web-dist
          path: Frontend/react-web/dist
          retention-days: 7

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Frontend/react-web/coverage
          retention-days: 14
