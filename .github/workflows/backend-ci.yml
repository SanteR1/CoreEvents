name: Backend CI/CD (.NET)

on:
  push:
    branches: [main, master, dev]
    paths:
      - "Gateway/**"
      - "Services/**"
      - "Shared/**"
      - "CoreEvents.slnx"
      - "Directory.Build.props"
      - ".editorconfig"
      - "global.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "Gateway/**"
      - "Services/**"
      - "Shared/**"
      - "CoreEvents.slnx"
      - "Directory.Build.props"
      - ".editorconfig"
      - "global.json"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore CoreEvents.slnx

      - name: Build solution & Run Roslyn Analyzers
        run: dotnet build CoreEvents.slnx --no-restore -c Release
        # Обратите внимание: сборка запускается с ContinuousIntegrationBuild=true (из-за GITHUB_ACTIONS='true'),
        # TreatWarningsAsErrors=true, EnforceCodeStyleInBuild=true, NuGetAudit=true
        # и всеми анализаторами из Directory.Build.props:
        # - SonarAnalyzer.CSharp
        # - Roslynator.Analyzers
        # - Roslynator.Formatting.Analyzers
        # - IDisposableAnalyzers
        # - .NET SDK CodeStyle / Recommended Analyzers

      - name: Run Tests (Unit & Integration)
        run: dotnet test CoreEvents.slnx --no-build -c Release

      - name: Publish Gateway API
        run: dotnet publish Gateway/Gateway.Api/Gateway.Api.csproj -c Release --no-build -o publish/gateway-api /p:UseAppHost=false

      - name: Publish Bookings API
        run: dotnet publish Services/Bookings/Bookings.Api/Bookings.Api.csproj -c Release --no-build -o publish/bookings-api /p:UseAppHost=false

      - name: Publish Events API
        run: dotnet publish Services/Events/Events.Api/Events.Api.csproj -c Release --no-build -o publish/events-api /p:UseAppHost=false

      - name: Publish Users API
        run: dotnet publish Services/Users/Users.Api/Users.Api.csproj -c Release --no-build -o publish/users-api /p:UseAppHost=false

      - name: Upload Published Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-services-publish
          path: publish/
          retention-days: 7

  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gateway-api
            dockerfile: Gateway/Gateway.Api/Dockerfile
          - name: bookings-api
            dockerfile: Services/Bookings/Bookings.Api/Dockerfile
          - name: events-api
            dockerfile: Services/Events/Events.Api/Dockerfile
          - name: users-api
            dockerfile: Services/Users/Users.Api/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.service.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: ${{ matrix.service.name }}:latest
